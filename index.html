<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/2c36cd333a.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <title>Tesla - Electric Cars</title>
</head>
<body>
    <div class="sticky">
        For a limited time, receive free Supercharging when you purchase a new Foundation Series Cybertruck.
        <span>Explore Inventory</span>
    </div>
    <nav>
        <div class="left-side">
            <img src="images/logo.svg" alt="Logo" class="logo">
        </div>
        <div class="middle-side">
            <ul>
                <li><a href="#">Vehicles</a></li>
                <li><a href="#">Energy</a></li>
                <li><a href="#">Charging</a></li>
                <li><a href="#">Discover</a></li>
                <li><a href="#">Shop</a></li>
            </ul>
        </div>
        <div class="right-side">
            <i class="fa-solid fa-question" style="color: #db0000;"></i>
            <i class="fa-solid fa-earth-americas" style="color: #db0000;"></i>
            <i class="fa-solid fa-user" style="color: #db0000;"></i>
        </div>
    </nav>

    <main>
        <h1>$299/mo Leasing</h1>
        <div class="buttons">
            <button class="model3">Order Model 3</button>
            <button class="model-y">Order Model Y</button>
        </div>
    </main>
</body>
</html>
